name: mypipeline

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write
  
jobs:
  build:
    runs-on: ubuntu-slim

    steps:
      - name: checkout
        uses: actions/checkout@v4


      - name: docker
        run: |
          chmod 777 /var/run/docker.sock
          docker build -t image1 .
